[project]
name = "maalc"
version = "0.0.0"
description = "MaaFramework automation for Limbus Company Mirror Dungeon"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = ["maafw~=5.14.3"]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["agent"]
testpaths = ["tests"]
