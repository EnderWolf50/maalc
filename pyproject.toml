[project]
name = "maalc"
version = "0.0.0"
description = "MaaFramework automation for Limbus Company Mirror Dungeon"
license = "PolyForm-Noncommercial-1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema>=4.26.0",
    "maafw~=5.14.3",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "numpy",
    "opencc-python-reimplemented",
    "opencv-python-headless",
    "pillow",
    "pytest",
    "pytest-timeout>=2.4.0",
    "ruff",
]
# Probe and live-test scripts: `uv run --group probe python <script>`.
probe = ["numpy", "opencv-python-headless", "pillow", "psutil"]
unpack = [
    "numpy",
    "opencc-python-reimplemented",
    "opencv-python-headless",
    "pillow>=13.0.0",
    "unitypy>=1.25.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["agent", "tools"]
testpaths = ["tests"]
# pytest-timeout: a test that hangs fails after this many seconds instead of holding the job for 50 minutes.
timeout = 300
timeout_method = "thread"  # two CI shards hung 25 minutes under the signal method, which never fired
# A file that runs a MaaFramework child gets run_child's own timeout and a minute instead (tests/conftest.py).

[tool.ruff.lint]
# Syntax errors and pyflakes: undefined names, unused imports, F811 redefinition.
select = ["E9", "F"]
