# What OCR reads off a card whose title art does not spell its pack's name -> that pack (#246). Matched like a name
# (spec 05 section 2). Read off the 2026-10-22 recordings: S.E.A.'s art says "The Magic Hello Bus" (live reads
# HellOBus, HellBus); The Noon of Violet's tops its name with "Walpurgis Night" (live: WalpurgisN The Noon of);
# Line 1's is the capitals "LINE 1 MADNESS" (live: MADNESS, #266).
title_art:
  Hello Bus: S.E.A.
  Walpurgis Night The Noon of: The Noon of Violet
  MADNESS: Line 1

# The default theme pack plan (spec 04 section 8 has the fields). Its weights are AALC's defaults
# (KIYI671/AhabAssistantLimbusCompany, assets/config/theme_pack_list.example.yaml at 45d9a58, AGPL-3.0; see
# NOTICE.md): only the number per pack, keyed by our full names. AALC keys its table by a fragment of the title
# (forgot, gambl, chick) and matches the first fragment found in the card's OCR text, likely because the stylized
# title fonts rarely OCR whole; maalc matches the whole name with OCR slips allowed (spec 05 section 2). The comment
# after a weight is the AALC fragment it came from; "HARD list" marks one from AALC's HARD-only table. AALC's
# NORMAL and HARD tables give no pack two different weights.
# Fallback fragments AALC lists for the same packs, same weights: nag (Nagel und Hammer), dev (Devoured Gluttony),
# deg (Degraded Gloom), shed (To be Crushed), ssed (Repressed Wrath), tread (Treadwheel Sloth), mne (Mnestic
# Experience), b·e (The B.E.), xte (Crushing External Force), unch (The Unchanging). Not taken: compassion
# (Pilgrimage of Compassion has no NORMAL or HARD floor in 1.117.0) and unknown -5 (unlisted stays 0, #240).
# No AALC fragment, so unlisted (0): Storefront Campout, An Anarchy of Colors, Creed of Preservation,
# Readvent of Gluttony.
default_plan:
  threshold: 0
  unlisted: 0
  event_packs: weight
  weights:
