# The default gift list (docs/spec/05-game-data.md section 9; #291, #293): the fields of a settings `gift_lists[]` entry without
# `id` and `name`. Read-only for users, who copy it to make their own. Developer-maintained, checked every season.
#
# Content (the user, 2026-10-30: "the default list only holds the Keywordless gifts; the user sets the rest"; then "want the
# Keywordless gifts that need a fusion again"; then "as you suggest, the default wants add Keywordless gifts only"): `want`, 57:
# gift_recipes.json's Keywordless fusion gifts but Lunar Memory (9249, 9764, 9780), so the shop buys the materials it sells
# for them and fuses them, kept materials too; then the 54 Keywordless gifts a shop may sell (gift_recipes.json `shop.sells`,
# #626) that a theme pack's own pool holds (specificEgoGiftPool of the game's mirrordungeon-theme-floor-* data, 1.118.1: 181
# gifts in all, 54 Keywordless, all of them sold; until #626 the 7 extra_gifts among them counted as unsold and were kept).
# `keep`, 70: every other Keywordless gift (of gift_search.json, Lunar Vestige 9995, then gift_recipes.json's Keywordless
# extra_gifts and Lunar Memory 9083, #332), then Lunar Memory's 10 materials (the user, 2026-11-11, #626 option C: 5 tier IV
# materials at about 400 Cost each and a 5-slot fusion only a Super Shop allows, so nothing is bought or refreshed for them,
# and they are never sold or used by an ordinary fusion); all others are `drop`, Burn too, and vestiges I-IV (9991-9994), so
# they stay fusion materials (Lunar Vestige, tier V, never is one).
# Until 2026-10-30 the list was the former default team (the user, 2026-10-23). `order`: the Gift Search page's tab order
# (Burn first, so the main keyword stays Burn). `gorder`: per keyword the gifts a shop may sell, tier IV first (#626), inside a
# tier gift_search.json's order, then gift_recipes.json's. tools/default_gift_list.py writes want, keep and gorder;
# tests/test_gift_lists.py derives them from the data files on its own.
