# Map routing weights (docs/spec/05-game-data.md section 5): the lowest goes first.
# Developer-maintained. The boss is not weighted: it is taken only when it is the only linked node.
#
# shop is not in the spec's table: the bot never seeks a shop (every floor has one before the boss),
# so it ranks after every fight it can recognise and before unknown, on both difficulties.
# risky: no template yet, the icon has not been seen live (spec 03, 未決 2). A Cost coin alone whose number
# is none of battle_costs reads as risky (#91); its wiki costs, 120 and 150, are no battle's.
# A battle's Cost, either difficulty (spec 05 section 6; live: 75 normal, 85 hard).
battle_costs: [75, 85]
normal:
  event: 1
  battle: 2
  focused: 4
  abno: 5
  risky: 6
  shop: 7
  unknown: 9
hard:
  event: 1
  battle: 2
  focused: 4
  abno: 5
  shop: 7
  risky: 8
  unknown: 9
