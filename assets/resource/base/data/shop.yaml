# Shop numbers (docs/spec/05-game-data.md section 6). Developer-maintained.
# Refresh fees are not listed: the bot reads them off the shop's two refresh buttons.
heal_cost: 100  # each of the three heal options
refresh_margin: 120  # a refresh must leave this much (plus the reserve) to buy with: about a tier I gift
# Fusion (#77; the game's mirror-dungeon-common-data-md8.json, client 1.117.0): a material's points by its tier, and
# the most points that still fuse into tier 1, 2 and 3 (more is tier 4). The tier follows the points.
# shop = combineTierResultByCombineScore (6-10, 11-16, 17-24, 25+); super_shop = enhancedCombineTierResultByCombineScore
# (6-9, 10-14, 15-21, 22+). The game's Fusion Guide shows the second with its `_upgrade` strings, the Super Shop's (#263).
# The guide has no table by difficulty: a HARD shop is a shop or a Super Shop like a NORMAL one (no capture of one yet).
# combineTwo / combineThree (a tier lookup by the materials' tiers) equal the shop table on every row (tests/test_shop.py).
fusion_points: {1: 3, 2: 6, 3: 10, 4: 15, 5: 30}
fusion_tiers:
  shop: [10, 16, 24]
  super_shop: [9, 14, 21]
