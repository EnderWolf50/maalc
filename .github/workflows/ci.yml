name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a PR cancels its older run. Other runs get a group of their own, so every main commit runs.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Which jobs a run needs. A PR picks them by its changed files. A push to main skips them all when a PR run already
  # passed every job on the same tree, and otherwise runs them all, as workflow_dispatch does.
  # code: a changed file outside docs and gui/ (agent, assets, tests, tools, configs, lock files, workflows), or one of
  # the docs, gui/ and *.md files the Python tests read (the readfilter step; tests/ci_filter.py fails a test run that
  # opens one it lacks, #684).
  # gui: any changed file outside docs; gui/ imports agent/, assets/ and tests/ files.
  # bot: a changed file the pipeline job reads: the bot's data and code (assets/, agent/), the screens maa-tools tests
  # against (tests/screens/), its config and dependencies, the OCR fetch, and this workflow. Anything else leaves
  # maa-tools out (#628).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.tested.outputs.tested != 'true' && (github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' || steps.readfilter.outputs.read == 'true') }}
      gui: ${{ steps.tested.outputs.tested != 'true' && (github.event_name != 'pull_request' || steps.filter.outputs.gui == 'true') }}
      bot: ${{ steps.tested.outputs.tested != 'true' && (github.event_name != 'pull_request' || steps.botfilter.outputs.bot == 'true') }}
      tree: ${{ steps.tree.outputs.tree }}
    steps:
      - id: tree
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq .tree.sha)
          echo "tree=$tree" | tee -a "$GITHUB_OUTPUT"
      # A PR run tests refs/pull/N/merge, whose tree is the merge commit's tree when main has not moved since.
      # A fork's PR run can upload any marker, so only a run from this repository counts.
      - if: github.event_name == 'push' && steps.tree.outputs.tree != ''
        id: tested
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TREE: ${{ steps.tree.outputs.tree }}
        run: |
          tested=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=ci-ok-tree-$TREE" --jq 'any(.artifacts[]; (.expired | not) and .workflow_run.head_repository_id == .workflow_run.repository_id)')
          echo "tested=$tested" | tee -a "$GITHUB_OUTPUT"
      - if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            code: ['**', '!docs/**', '!*.md', '!LICENSE', '!gui/**']
            gui: ['**', '!docs/**', '!*.md', '!LICENSE']
      # A step of its own: the one above needs every pattern to match a file (predicate-quantifier: every), and a bot
      # file matches only one of these.
      - if: github.event_name == 'pull_request'
        id: botfilter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            bot:
              - 'assets/**'
              - 'agent/**'
              - 'tests/screens/**'
              - 'maatools.config.mts'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tools/fetch_ocr.py'
              - '.github/workflows/ci.yml'
      # The non-code files the Python tests open, found by recording the opens of one full pytest run (#684). A new one
      # is added here when tests/ci_filter.py says so.
      - if: github.event_name == 'pull_request'
        id: readfilter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            read:
              - 'docs/agents/subagent-preamble.md'
              - 'docs/agents/triage-labels.md'
              - 'docs/agents/watchdog-prompt.md'
              - 'gui/package.json'
              - 'gui/src-tauri/Cargo.toml'
              - 'gui/src-tauri/tauri.conf.json'
              - 'gui/src/grace_card/**'
              - 'gui/src/grace_icons/**'
              - 'gui/src/graces.json'
              - 'gui/src/i18n.ts'

  # The bot runs on Windows only, so the jobs that test it run there too (#636): a test that holds on Linux alone proves
  # nothing about the bot. The jobs that run no test (changes, shard-balance, review-lint, ci-ok) stay on Linux, which
  # starts sooner, and their bash steps run as written.
  agent:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # tests/conftest.py balances the test files over however many shards are listed here. A shard runs its files
        # one at a time: two MaaFramework children on one runner's 4 vCPUs share its CPU and outlast run_child's timeout.
        shard: [0, 1, 2, 3]
    env:
      SHARD: ${{ strategy.job-index }}
      SHARDS: ${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      # Lints every file regardless of SHARD: once is enough.
      - if: strategy.job-index == 0
        run: uv run ruff check
      - run: uv run python tools/fetch_ocr.py  # test_shop_cells reads the fuse page's labels by OCR (#205)
      - run: uv run pytest --junitxml=junit.xml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ strategy.job-index }}
          path: junit.xml
          if-no-files-found: ignore
          retention-days: 14

  # Reports when tests/shard_seconds.json no longer matches this run, and names the command that rewrites it. It does
  # not block: ci-ok does not wait for it (#628). The step stays green; the report is a warning and the job summary.
  shard-balance:
    needs: agent
    if: needs.agent.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: junit-*
          path: junit
      - run: |
          python3 tools/shard_seconds.py check junit/*/junit.xml > shard-balance.txt 2>&1 && status=0 || status=$?
          cat shard-balance.txt
          if [ "$status" != 0 ]; then
            echo "::warning title=shard-balance::the check reported a problem (exit $status); the report is in the job summary"
            { echo "### shard-balance: exit $status"; echo '```'; cat shard-balance.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

  # maa-tools check and test: only a change to a file the bot reads (the changes job's bot output).
  pipeline:
    needs: changes
    if: needs.changes.outputs.bot == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # maatools.config.mts balances the nodes over however many shards are listed here.
        shard: [0, 1, 2, 3, 4, 5]
    env:
      SHARD: ${{ strategy.job-index }}
      SHARDS: ${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Checks the whole pipeline regardless of SHARD: once is enough.
      - if: strategy.job-index == 0
        run: pnpm exec maa-tools check
      - run: python tools/fetch_ocr.py
      - run: pnpm exec maa-tools test

  gui:
    needs: changes
    if: needs.changes.outputs.gui == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: gui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: gui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # tauri's generate_context! needs the built frontend in gui/dist.
      - run: pnpm exec vite build
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml

  # What the branch adds, against its base (tools/review_lint.py). Docs-only pull requests run it too.
  review-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tools/review_lint.py origin/${{ github.base_ref }}

  # The one check to require: fails if the filter or any job it asked for failed or was cancelled. A skipped job (not
  # asked for) is fine, and shard-balance only reports.
  ci-ok:
    if: always()
    needs: [changes, agent, pipeline, gui, review-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: needs.changes.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      # Only a run that ran every job proves the whole tree, so a docs-only or gui-only PR leaves no marker,
      # unless the gui file it changes is one the Python tests read: then the agent and gui jobs both ran.
      # A PR that skipped pipeline for lack of bot files still leaves one: its bot files equal its base's, which main's
      # own green run covered.
      - if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true' && needs.changes.outputs.gui == 'true' && needs.changes.outputs.tree != ''
        id: marker
        env:
          TREE: ${{ needs.changes.outputs.tree }}
        run: echo "$TREE" > tree
      - if: steps.marker.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ci-ok-tree-${{ needs.changes.outputs.tree }}
          path: tree
          retention-days: 14
          overwrite: true
