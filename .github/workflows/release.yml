name: release

on:
  push:
    tags: ["v*"]
  # Build (artifact only) when the release pipeline itself changes.
  pull_request:
    paths: [.github/workflows/release.yml, tools/install.py]
  workflow_dispatch:
    inputs:
      tag:
        description: Also attach the zip to a draft release with this tag name (leave empty for artifact only)
        required: false

permissions:
  contents: write

jobs:
  zip:
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: gui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: gui/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri
      - run: pnpm install --frozen-lockfile
        working-directory: gui
      - run: pnpm tauri build --no-bundle
        working-directory: gui
      - run: uv run --frozen --no-dev python tools/fetch_ocr.py
      - run: uv run --frozen --no-dev python tools/install.py --release
      - name: Zip install/ as maalc/
        run: |
          $name = if ($env:TAG) { "maalc-$env:TAG" } else { "maalc-$($env:GITHUB_SHA.Substring(0, 7))" }
          Rename-Item install maalc
          7z a -tzip "$name.zip" maalc
          "ZIP=$name.zip" >> $env:GITHUB_ENV
      # A convenience copy; the draft release is the output. Kept off the
      # critical path so a full Actions storage quota does not fail the build.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ env.ZIP }}
          path: ${{ env.ZIP }}
          compression-level: 0
          retention-days: 3
      - if: env.TAG != ''
        run: gh release create $env:TAG $env:ZIP --draft --target $env:GITHUB_SHA --title $env:TAG --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
