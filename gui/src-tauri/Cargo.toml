[package]
name = "maalc-gui"
version = "1.0.0"
description = "maalc settings GUI"
license = "PolyForm-Noncommercial-1.0.0"
edition = "2024"

[lib]
# Distinct from the bin name, see https://github.com/rust-lang/cargo/issues/8519
name = "maalc_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# The accent colour of Windows (accent_color in lib.rs), at the version Tauri already pulls in.
[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
