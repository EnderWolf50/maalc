[package]
name = "maalc-gui"
version = "1.0.0"
description = "maalc settings GUI"
license = "PolyForm-Noncommercial-1.0.0"
edition = "2024"

[lib]
# Distinct from the bin name, see https://github.com/rust-lang/cargo/issues/8519
name = "maalc_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
# a second start hands its arguments to the window that is open (#815)
tauri-plugin-single-instance = "2"

# The runner's process tree in a Job Object (src/runner.rs); the version Tauri's own dependencies already lock.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
